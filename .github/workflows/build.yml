name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Standard: nur lesen. Schreibrechte bekommt ausschließlich der Release-Job.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# Alle Actions sind auf feste Commit-Kennungen angepinnt (Schutz vor veränderten Versionen).
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Java 17 einrichten
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Version auslesen
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then echo "versionName nicht gefunden"; exit 1; fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Signatur-Secrets prüfen und Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          FEHLT=0
          for NAME in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!NAME}" ]; then echo "::error::Secret $NAME fehlt oder ist leer."; FEHLT=1; fi
          done
          if [ "$FEHLT" -ne 0 ]; then echo "Ohne alle vier Signatur-Secrets wird nicht gebaut."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Code prüfen, testen und signierte Release-APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lintRelease testReleaseUnitTest assembleRelease --no-daemon

      - name: Prüfbericht (Lint) speichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-bericht-${{ steps.version.outputs.name }}
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: APK umbenennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/moltobene-${{ steps.version.outputs.name }}.apk"

      - name: APK als Build-Ergebnis speichern
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moltobene-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Zuordnungsdatei für Fehlermeldungen speichern
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  release:
    # Nur für den Hauptzweig; dieser Job hat als einziger Schreibrechte und sieht keine Signatur-Secrets.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Code auschecken (für CHANGELOG.md)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: APK aus dem Build holen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moltobene-${{ needs.build.outputs.version }}
          path: dist

      - name: Release anlegen (nur wenn Version neu)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG existiert bereits - kein neues Release."
            exit 0
          fi
          # Abschnitt dieser Version aus CHANGELOG.md herausschneiden
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Version $VERSION" > release-notes.md; fi
          gh release create "$TAG" "dist/moltobene-$VERSION.apk" \
            --title "Moltobene $VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
