name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Standard: nur lesen. Schreibrechte bekommt ausschließlich der Release-Job.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Fingerabdruck des Signaturzertifikats. Ändert er sich, wurde der Schlüssel ersetzt –
  # dann ließen sich Updates nicht mehr installieren, deshalb bricht der Build ab.
  SIGNATUR_FINGERABDRUCK: "2A:8A:99:1C:E9:68:47:D2:0B:AC:DF:74:4F:1E:E8:95:E7:28:35:8B:06:83:EA:99:3E:42:58:65:F6:D5:2C:1A"

# Alle Actions sind auf feste Commit-Kennungen angepinnt (Schutz vor veränderten Versionen).
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Java 17 einrichten
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Version auslesen
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          if [ -z "$VERSION" ] || [ -z "$CODE" ]; then echo "::error::versionName oder versionCode nicht gefunden."; exit 1; fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (versionCode $CODE)"

      # #5: Fehler hier fallen sonst erst beim Installieren auf.
      - name: Versionsnummer und Änderungsprotokoll prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          ZEILE=$(grep -m1 -F "## [$VERSION]" CHANGELOG.md || true)
          if [ -z "$ZEILE" ]; then
            echo "::error::In CHANGELOG.md fehlt der Abschnitt „## [$VERSION]“."
            exit 1
          fi
          if ! echo "$ZEILE" | grep -qF "(versionCode $CODE)"; then
            echo "::error::Der Abschnitt „## [$VERSION]“ in CHANGELOG.md nennt nicht versionCode $CODE."
            exit 1
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION gibt es schon – keine neue Version, nur bauen."
            exit 0
          fi
          LETZTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> /dev/null || true)
          if [ -z "$LETZTES" ]; then
            echo "Noch kein Release vorhanden."
            exit 0
          fi
          ALT=$(gh api "repos/$GITHUB_REPOSITORY/contents/app/build.gradle.kts?ref=$LETZTES" --jq .content \
            | base64 --decode | grep -oP 'versionCode\s*=\s*\K\d+' || true)
          if [ -z "$ALT" ]; then
            echo "::error::versionCode des letzten Release $LETZTES nicht lesbar."
            exit 1
          fi
          if [ "$CODE" -le "$ALT" ]; then
            echo "::error::versionCode $CODE ist nicht größer als beim letzten Release $LETZTES ($ALT). Android würde das Update ablehnen."
            exit 1
          fi
          echo "Neue Version $VERSION: versionCode $ALT → $CODE"

      - name: Signatur-Secrets prüfen und Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          FEHLT=0
          for NAME in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!NAME}" ]; then echo "::error::Secret $NAME fehlt oder ist leer."; FEHLT=1; fi
          done
          if [ "$FEHLT" -ne 0 ]; then echo "Ohne alle vier Signatur-Secrets wird nicht gebaut."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Code prüfen, testen und signierte Release-APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Unit-Tests gibt es seit AGP 9 nur noch für die Debug-Variante (gleicher Code, ohne Verkleinerung).
        run: ./gradlew lintRelease testDebugUnitTest assembleRelease --no-daemon

      - name: Prüfbericht (Lint) speichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-bericht-${{ steps.version.outputs.name }}
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Baupläne der Datenbank speichern
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datenbank-schema-${{ steps.version.outputs.name }}
          path: app/schemas
          if-no-files-found: ignore

      - name: APK umbenennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/moltobene-${{ steps.version.outputs.name }}.apk"

      # #13: Nur eine APK mit gültiger Signatur und dem bekannten Schlüssel wird weitergegeben.
      - name: Signatur prüfen
        env:
          APK: dist/moltobene-${{ steps.version.outputs.name }}.apk
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          echo "Prüfwerkzeug: $APKSIGNER"
          ZERTIFIKATE=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
          echo "$ZERTIFIKATE"
          DIGESTS=$(echo "$ZERTIFIKATE" | grep -oiE 'certificate SHA-256 digest: *[0-9a-f]{64}' | grep -oiE '[0-9a-f]{64}' | sort -u || true)
          ANZAHL=$(echo "$DIGESTS" | grep -c . || true)
          FINGERABDRUCK=$(echo "$DIGESTS" | head -n 1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          if [ "$ANZAHL" -ne 1 ] || [ "$FINGERABDRUCK" != "$SIGNATUR_FINGERABDRUCK" ]; then
            echo "::error::Die APK ist nicht mit dem bekannten Schlüssel signiert (gefunden: $FINGERABDRUCK)."
            exit 1
          fi
          echo "Signatur in Ordnung: $FINGERABDRUCK"

      - name: APK als Build-Ergebnis speichern
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moltobene-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Zuordnungsdatei für Fehlermeldungen speichern
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  testlauf:
    # Rundgang durch die App auf einem virtuellen Android-Handy (Emulator) mit Bildschirmfotos
    # (app/src/androidTest). Baut nur Debug-Versionen und sieht keine Secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Android 14 mit Google-APIs: kann auch die Texterkennung (nur für Handy-Prozessoren gebaut) ausführen.
      SYSTEMABBILD: "system-images;android-34;google_apis;x86_64"

    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Java 17 einrichten
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Version auslesen
        id: version
        run: echo "name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Virtualisierung für den Emulator freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Nur Werkzeuge von Google (Android SDK); das virtuelle Handy hat die Bildschirmgröße eines
      # günstigen Handys (360 × 760 dp) und eine Hardware-Tastatur, damit keine Bildschirmtastatur
      # die Bildschirmfotos verdeckt.
      - name: Emulator einrichten und im Hintergrund starten
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # Fester Ordner für das virtuelle Handy (sonst je nach Runner unterschiedlich).
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install emulator platform-tools "$SYSTEMABBILD" > /dev/null
          echo no | "$AVDMANAGER" create avd --name testhandy --package "$SYSTEMABBILD" --force
          CONFIG="$ANDROID_AVD_HOME/testhandy.avd/config.ini"
          sed -i '/^hw\.lcd\./d; /^hw\.keyboard/d; /^hw\.ramSize/d; /^skin\./d' "$CONFIG"
          printf '%s\n' hw.lcd.width=720 hw.lcd.height=1520 hw.lcd.density=320 hw.keyboard=yes hw.ramSize=3072 >> "$CONFIG"
          nohup "$ANDROID_HOME/emulator/emulator" -avd testhandy -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none > emulator.log 2>&1 &

      # Läuft, während der Emulator startet.
      - name: App und Rundgang bauen
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Warten, bis der Emulator bereit ist
        run: |
          adb wait-for-device
          timeout 600 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put system screen_off_timeout 1800000
          adb shell svc power stayon true
          adb shell wm dismiss-keyguard
          adb shell rm -rf /data/local/tmp/moltobene-bildschirmfotos

      - name: Rundgang durch die App
        run: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Fehlgeschlagene Schritte des Rundgangs anzeigen
        if: failure()
        # Gradle nennt im Protokoll nur „There were failing tests“; die Einzelheiten stehen in den XML-Ergebnissen.
        run: |
          find app/build/outputs/androidTest-results -name '*.xml' 2>/dev/null | head -5
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      text = (problem.text or problem.get("message") or "").strip().splitlines()
                      print(f"::error::{case.get('classname')}.{case.get('name')}: {text[0] if text else ''}")
                      print("\n".join(text[:25]))
          PY

      - name: Bildschirmfotos vom Emulator holen
        if: always()
        run: adb pull /data/local/tmp/moltobene-bildschirmfotos bildschirmfotos || echo "Keine Bildschirmfotos vorhanden."

      - name: Bildschirmfotos speichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bildschirmfotos-${{ steps.version.outputs.name }}
          path: bildschirmfotos
          if-no-files-found: ignore

      - name: Testbericht speichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testbericht-${{ steps.version.outputs.name }}
          path: |
            app/build/reports/androidTests/connected
            emulator.log
          if-no-files-found: ignore

  release:
    # Nur für den Hauptzweig; dieser Job hat als einziger Schreibrechte und sieht keine Signatur-Secrets.
    # Ein Release gibt es nur, wenn auch der Rundgang auf dem Emulator geklappt hat.
    needs: [build, testlauf]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Für den Herkunftsnachweis (#13)
      id-token: write
      attestations: write

    steps:
      - name: Code auschecken (für CHANGELOG.md)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prüfen, ob die Version neu ist
        id: neu
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION existiert bereits - kein neues Release."
            echo "neu=false" >> "$GITHUB_OUTPUT"
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
          fi

      - name: APK aus dem Build holen
        if: steps.neu.outputs.neu == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moltobene-${{ needs.build.outputs.version }}
          path: dist

      - name: Prüfsumme und Release-Text erzeugen
        if: steps.neu.outputs.neu == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd dist && sha256sum "moltobene-$VERSION.apk" > "moltobene-$VERSION.apk.sha256")
          bash .github/scripts/release-text.sh "$VERSION" "dist/moltobene-$VERSION.apk" > release-notes.md
          cat release-notes.md

      - name: Herkunftsnachweis anlegen
        if: steps.neu.outputs.neu == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/moltobene-${{ needs.build.outputs.version }}.apk

      - name: Release anlegen
        if: steps.neu.outputs.neu == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/moltobene-$VERSION.apk" "dist/moltobene-$VERSION.apk.sha256" \
            --title "Moltobene $VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
